<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=null;try{t=localStorage.getItem('sona-theme');}catch(e){}if(t!=='light'&&t!=='dark'){t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="color-scheme" content="light dark">
<script>window.__authScriptsLoaded = true; /* clerk-auth.js is loaded below; site.js must not add a second copy. */</script>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/site.css?v=20261106d">
<title>Start free with Sona</title>
<link rel="canonical" href="https://buildwithsona.com/signin">
<style>
  /* Two steps, one field each: email, then the code. Everything hangs off one
     left edge, from the logo to the fine print, over the cursor-lit grid. */
  body { min-height: 100dvh; display: flex; flex-direction: column; padding: 24px clamp(20px, 7vw, 96px) 24px; }
  .grid { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }
  .brand { align-self: flex-start; display: inline-flex; align-items: center; gap: 9px; min-height: 40px; text-decoration: none; color: var(--ink); font-family: var(--word); font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
  .brand img { width: 26px; height: 26px; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 520px; padding: 40px 0; }
  h1 { font-size: clamp(2.5rem, 6vw, 3.75rem); line-height: 1.02; letter-spacing: -.04em; }
  .step[hidden] { display: none; }
  .step { animation: step-in .32s var(--ease-out, ease-out); }
  @keyframes step-in { from { opacity: 0; transform: translateY(6px); } }

  label.field { display: block; margin: 36px 0 8px; font-size: 14px; font-weight: 500; color: var(--ink-2); }

  /* The email and its button are one object. */
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-float); transition: box-shadow .2s ease; }
  .bar:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px var(--accent-wash); }
  .bar.bad { box-shadow: inset 0 0 0 1.5px #dc2626, 0 0 0 4px rgba(220,38,38,.1); }
  .bar input { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 0; outline: 0; background: transparent; font: inherit; font-size: 17px; letter-spacing: -.01em; color: var(--ink); }
  .bar input::placeholder { color: var(--ink-3); }
  .bar .btn { flex: none; min-height: 48px; border-radius: 11px; }

  /* The code: one real input (so paste and phone autofill work), drawn as six cells. */
  .code { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; max-width: 420px; }
  .cell { display: grid; place-items: center; height: 64px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); font-family: var(--mono); font-size: 26px; font-weight: 500; color: var(--ink); transition: box-shadow .15s ease; }
  .cell.on { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px var(--accent-wash); }
  .code.bad .cell { box-shadow: inset 0 0 0 1.5px #dc2626; }
  .code.busy .cell { opacity: .55; }
  .code input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px; caret-color: transparent; cursor: text; }

  .msg { min-height: 22px; margin-top: 10px; font-size: 14px; line-height: 1.5; color: #b91c1c; }
  html[data-theme="dark"] .msg { color: #fca5a5; }
  .fine { margin-top: 6px; max-width: 46ch; font-size: 13.5px; line-height: 1.6; color: var(--ink-3); }
  .fine a { color: var(--ink-2); }
  .acts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; font-size: 14px; }
  .acts button { min-height: 32px; padding: 0; border: 0; background: none; font: inherit; color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 4px; cursor: pointer; }
  .acts button[disabled] { color: var(--ink-3); text-decoration: none; cursor: default; }
  .sent { margin-top: 36px; font-size: 16px; color: var(--ink-2); overflow-wrap: anywhere; }
  .sent b { color: var(--ink); font-weight: 600; }
  #clerk-captcha:not(:empty) { margin-top: 14px; }

  .foot { display: flex; gap: 18px; font-size: 13px; }
  .foot a { color: var(--ink-3); }

  @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  @media (max-width: 480px) {
    .bar { flex-direction: column; align-items: stretch; }
    .bar .btn { width: 100%; }
    .cell { height: 54px; font-size: 22px; }
    .code { gap: 6px; }
  }
</style>
</head>
<body>
<canvas class="grid" data-dots aria-hidden="true"></canvas>
<a class="brand" href="/"><img src="/logo.svg?v=2" alt="" width="26" height="26">Sona</a>

<main>
  <form class="step" id="s-email" novalidate>
    <h1 id="title">Start free.<br><span class="tone">Just your email.</span></h1>
    <label class="field" for="email">Email</label>
    <div class="bar" id="bar">
      <input id="email" type="email" name="email" placeholder="you@email.com" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" autofocus aria-describedby="email-msg">
      <button class="btn btn-go" type="submit" id="go">Continue</button>
    </div>
    <div id="clerk-captcha"></div>
    <p class="msg" id="email-msg" role="alert"></p>
    <p class="fine">We’ll email you a 6-digit code. No password. By continuing you confirm you’re 16 or older and agree to the <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p>
  </form>

  <form class="step" id="s-code" novalidate hidden>
    <h1>Check your email.<br><span class="tone">Enter the code.</span></h1>
    <p class="sent">Sent to <b id="sent-to"></b></p>
    <label class="field" for="code" style="margin-top:16px">6-digit code</label>
    <div class="code" id="code-wrap">
      <span class="cell" aria-hidden="true"></span><span class="cell" aria-hidden="true"></span><span class="cell" aria-hidden="true"></span><span class="cell" aria-hidden="true"></span><span class="cell" aria-hidden="true"></span><span class="cell" aria-hidden="true"></span>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="code-msg">
    </div>
    <p class="msg" id="code-msg" role="alert"></p>
    <div class="acts">
      <button type="button" id="resend">Send a new code</button>
      <button type="button" id="change">Use a different email</button>
    </div>
  </form>
</main>

<footer class="foot"><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a><a href="/contact.html">Help</a></footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);

  // Only same-site paths are followed after signing in. The browser resolves
  // the value first, so tricks like "/\evil.com" (which browsers read as
  // "//evil.com") end up on another origin and are refused.
  function samePath(raw) {
    if (!raw) return '/app';
    try {
      var u = new URL(raw, location.origin);
      if (u.origin !== location.origin || u.protocol !== location.protocol) return '/app';
      return u.pathname + u.search + u.hash;
    } catch (e) { return '/app'; }
  }
  var next = samePath(params.get('next'));

  if (params.get('new') !== '1') {
    $('title').innerHTML = 'Welcome back.<br><span class="tone">Just your email.</span>';
    document.title = 'Sign in to Sona';
  }

  var flow = null;
  function clerkReady() {
    return new Promise(function (resolve) {
      (function wait() {
        if (window.SonaAuth && window.SonaAuth.getClerk) return resolve(window.SonaAuth.getClerk());
        setTimeout(wait, 40);
      })();
    });
  }
  // Someone already signed in has nothing to do here.
  var ready = clerkReady().then(function (clerk) {
    if (clerk.user) { location.replace(next); return new Promise(function () {}); }
    flow = window.SonaSignin.createFlow(clerk);
  });

  function show(step) {
    $('s-email').hidden = step !== 'email';
    $('s-code').hidden = step !== 'code';
    (step === 'email' ? $('email') : $('code')).focus();
  }

  // ── Step 1: email ──
  var form = $('s-email'), input = $('email'), go = $('go'), bar = $('bar'), emailMsg = $('email-msg');
  function emailError(text) {
    emailMsg.textContent = text;
    bar.classList.toggle('bad', Boolean(text));
    input.setAttribute('aria-invalid', text ? 'true' : 'false');
  }
  input.addEventListener('input', function () { emailError(''); });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (go.disabled) return;
    var email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailError('Enter your email, like you@email.com.');
      input.focus();
      return;
    }
    emailError('');
    go.disabled = true; go.textContent = 'Sending…';
    try {
      await ready;
      await flow.start(email);
      // Continuing is the agreement to the age line and the terms.
      try { localStorage.setItem('sona_age_16_confirmed', '1'); } catch (_) {}
      $('sent-to').textContent = email;
      setCode('');
      codeError('');
      show('code');
      cooldown();
    } catch (err) {
      console.warn('[signin]', window.SonaSignin.codeOf(err) || err);
      emailError(window.SonaSignin.messageFor(err));
    } finally {
      go.disabled = false; go.textContent = 'Continue';
    }
  });

  // ── Step 2: code ──
  var code = $('code'), wrap = $('code-wrap'), codeMsg = $('code-msg'), resend = $('resend');
  var cells = wrap.querySelectorAll('.cell');
  var checking = false;

  function paint() {
    var v = code.value, focused = document.activeElement === code;
    cells.forEach(function (c, i) {
      c.textContent = v[i] || '';
      c.classList.toggle('on', focused && i === Math.min(v.length, 5));
    });
  }
  function setCode(v) { code.value = v; paint(); }
  function codeError(text) {
    codeMsg.textContent = text;
    wrap.classList.toggle('bad', Boolean(text));
    code.setAttribute('aria-invalid', text ? 'true' : 'false');
  }
  code.addEventListener('focus', paint);
  code.addEventListener('blur', paint);
  code.addEventListener('input', function () {
    var v = code.value.replace(/\D/g, '').slice(0, 6);
    setCode(v);
    if (v.length) codeError('');
    if (v.length === 6) check();
  });

  async function check() {
    if (checking) return;
    checking = true;
    wrap.classList.add('busy');
    try {
      await flow.verify(code.value);
      location.replace(next);
    } catch (err) {
      console.warn('[signin]', window.SonaSignin.codeOf(err) || err);
      codeError(window.SonaSignin.messageFor(err));
      setCode('');
      code.focus();
      wrap.classList.remove('busy');
      checking = false;
    }
  }
  $('s-code').addEventListener('submit', function (e) {
    e.preventDefault();
    if (code.value.length === 6) check();
  });

  var timer = 0;
  function cooldown() {
    var left = 30;
    clearInterval(timer);
    resend.disabled = true;
    resend.textContent = 'Send a new code in ' + left + 's';
    timer = setInterval(function () {
      left -= 1;
      if (left > 0) { resend.textContent = 'Send a new code in ' + left + 's'; return; }
      clearInterval(timer);
      resend.disabled = false;
      resend.textContent = 'Send a new code';
    }, 1000);
  }
  resend.addEventListener('click', async function () {
    resend.disabled = true;
    try {
      await flow.resend();
      codeError('');
      setCode('');
      code.focus();
      cooldown();
    } catch (err) {
      codeError(window.SonaSignin.messageFor(err));
      resend.disabled = false;
    }
  });
  $('change').addEventListener('click', function () {
    clearInterval(timer);
    show('email');
    input.select();
  });
})();
</script>
<script src="/signin-flow.js?v=20261108a" defer></script>
<script src="/clerk-auth.js?v=20261108c" defer></script>
<script src="/site.js?v=20261108a" defer></script>
</body>
</html>
