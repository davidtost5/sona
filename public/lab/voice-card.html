<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Call Zeno preview | Sona</title>
<script>(function(){try{var t=null;try{t=localStorage.getItem('sona-theme');}catch(e){}if(t==='light'||t==='dark'){window.__sonaThemeChosen=true;}else{t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/site.css?v=20261106d">
<link rel="stylesheet" href="/components/voice-card.css?v=20261107f">
<style>
  .lab { min-height: 100vh; display: grid; place-items: center; gap: 28px; padding: 48px 16px; }
  .lab-stage { display: grid; place-items: center; gap: 18px; }
  .lab-note { max-width: 46ch; text-align: center; font-size: 14px; color: var(--ink-3); }
</style>
</head>
<body>
<main class="lab">
  <div class="lab-stage">
    <div data-voice-card></div>
    <p class="lab-note">Preview only. Tapping the button plays a scripted demo; nothing is recorded.</p>
    <div class="theme-toggle" role="group" aria-label="Colour theme">
      <button type="button" data-theme-set="light" aria-pressed="false" aria-label="Light mode" title="Light mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
      <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Dark mode" title="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
    </div>
  </div>
</main>
<script src="/components/zeno-orbit.js?v=20261107g" defer></script>
<script src="/components/voice-card.js?v=20261107g" defer></script>
<script src="/site.js?v=20261106d" defer></script>
</body>
</html>
