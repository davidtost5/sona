<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ogt ogd">
  <title id="ogt">Sona social share image</title>
  <desc id="ogd">Dark branded card: Sona logo, headline "Surrounded by what's working. Always in your voice." and buildwithsona.com.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141317"/>
      <stop offset="1" stop-color="#0d0c0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#28775c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#28775c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1a1f"/>
      <stop offset="1" stop-color="#151419"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="1080" cy="80" rx="520" ry="380" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <g transform="translate(80,74)">
    <rect width="56" height="56" rx="15" fill="url(#sq)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(13,13) scale(1.25)">
      <path d="M5 15 Q8 9 12 12 Q16 15 19 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M19 3.6 C19.15 5.1 20.3 6.25 21.8 6.4 C20.3 6.55 19.15 7.7 19 9.2 C18.85 7.7 17.7 6.55 16.2 6.4 C17.7 6.25 18.85 5.1 19 3.6 Z" fill="#5fb896"/>
    </g>
    <text x="74" y="38" font-family="Geist, Inter, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#f4f3f1" letter-spacing="-0.5">Sona</text>
    <g transform="translate(158,12)">
      <rect width="62" height="26" rx="13" fill="#28775c" fill-opacity="0.18" stroke="#5fb896" stroke-opacity="0.5"/>
      <text x="31" y="18" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8fd0b4">BETA</text>
    </g>
  </g>

  <g transform="translate(680,160)" opacity="0.97">
    <rect width="460" height="330" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- window chrome: this is the real product, not a mockup card -->
    <circle cx="24" cy="24" r="4" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="40" cy="24" r="4" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="56" cy="24" r="4" fill="#ffffff" fill-opacity="0.14"/>
    <text x="90" y="29" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="0.3" fill="#8b8994">buildwithsona.com/app</text>
    <line x1="0" y1="46" x2="460" y2="46" stroke="#ffffff" stroke-opacity="0.07"/>

    <!-- search -->
    <rect x="20" y="62" width="420" height="36" rx="10" fill="#141317" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="42" cy="80" r="6" fill="none" stroke="#7c7a85" stroke-width="1.6"/>
    <line x1="46.4" y1="84.4" x2="51" y2="89" stroke="#7c7a85" stroke-width="1.6" stroke-linecap="round"/>
    <text x="60" y="85" font-family="Geist, sans-serif" font-size="13.5" fill="#8b8994">Find ideas</text>
    <text x="420" y="85" text-anchor="end" font-family="'Geist Mono', monospace" font-size="10.5" fill="#5c5a63">⌘K</text>

    <!-- filters: same categories the product actually uses -->
    <rect x="20" y="112" width="84" height="27" rx="100" fill="#28775c" fill-opacity="0.22" stroke="#5fb896" stroke-opacity="0.5"/>
    <text x="62" y="130" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="500" fill="#8fd0b4">Founders</text>
    <rect x="112" y="112" width="70" height="27" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="147" y="130" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" fill="#9b99a4">Writers</text>
    <rect x="190" y="112" width="76" height="27" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="228" y="130" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" fill="#9b99a4">Creators</text>

    <!-- one real feed card -->
    <g transform="translate(20,158)">
      <rect width="420" height="150" rx="14" fill="#17161b" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="28" cy="27" r="13" fill="#2a2a31"/>
      <text x="52" y="24" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#e9e7ee">Alex Hormozi</text>
      <text x="52" y="40" font-family="'Geist Mono', monospace" font-size="10.5" fill="#7c7a85">@AlexHormozi · X</text>
      <text x="392" y="31" text-anchor="end" font-family="'Geist Mono', monospace" font-size="10.5" fill="#6f6d77">1.2M views</text>
      <text x="24" y="72" font-family="Geist, sans-serif" font-size="13.5" fill="#cfcdd6"><tspan x="24" dy="0">Most founders post too much — not too little.</tspan><tspan x="24" dy="20">The ones who break out pick one take.</tspan></text>
      <rect x="24" y="114" width="92" height="27" rx="100" fill="#28775c" fill-opacity="0.16"/>
      <text x="70" y="132" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" fill="#8fd0b4">12× outlier</text>
      <g transform="translate(234,114)">
        <rect width="58" height="27" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="29" y="18" text-anchor="middle" font-family="Geist, sans-serif" font-size="11.5" fill="#cfcdd6">Decode</text>
      </g>
      <g transform="translate(300,114)">
        <rect width="54" height="27" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="27" y="18" text-anchor="middle" font-family="Geist, sans-serif" font-size="11.5" fill="#cfcdd6">Save</text>
      </g>
    </g>
  </g>

  <text x="80" y="320" font-family="Geist, Inter, sans-serif" font-size="62" font-weight="600" fill="#f6f5f3" letter-spacing="-2.2">Surrounded by</text>
  <text x="80" y="392" font-family="Geist, Inter, sans-serif" font-size="62" font-weight="600" fill="#f6f5f3" letter-spacing="-2.2">what's working.</text>
  <text x="80" y="462" font-family="Geist, Inter, sans-serif" font-size="62" font-weight="600" fill="#7cc7a6" letter-spacing="-2.2">Always in your voice.</text>

  <text x="82" y="520" font-family="Geist, sans-serif" font-size="21" fill="#9b99a4" letter-spacing="-0.2">Find proven outliers · decode why they worked · write them in your voice.</text>

  <text x="80" y="585" font-family="'Geist Mono', monospace" font-size="19" fill="#cfcdd6" letter-spacing="0.5">buildwithsona.com</text>
  <text x="1120" y="585" text-anchor="end" font-family="Geist, sans-serif" font-size="16" fill="#6f6d77">No AI writes for you. You write.</text>
</svg>
