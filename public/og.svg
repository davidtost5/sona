<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ogt ogd">
  <title id="ogt">Sona social share image</title>
  <desc id="ogd">Minimal dark card: small Sona mark, centered headline "Surrounded by what's working. Always in your voice.", a Request access pill, and buildwithsona.com.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111013"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#28775c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#28775c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="430" cy="330" rx="480" ry="320" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- mark, kept small and quiet -->
  <g transform="translate(90,70)">
    <rect width="40" height="40" rx="11" fill="url(#sq)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(9,9) scale(0.92)">
      <path d="M5 15 Q8 9 12 12 Q16 15 19 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M19 3.6 C19.15 5.1 20.3 6.25 21.8 6.4 C20.3 6.55 19.15 7.7 19 9.2 C18.85 7.7 17.7 6.55 16.2 6.4 C17.7 6.25 18.85 5.1 19 3.6 Z" fill="#5fb896"/>
    </g>
    <text x="52" y="26" font-family="Geist, Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#e6e5e2" letter-spacing="-0.3">Sona</text>
  </g>

  <!-- centered, contained text block -->
  <text x="150" y="262" font-family="Geist, Inter, sans-serif" font-size="54" font-weight="600" fill="#f6f5f3" letter-spacing="-1.8">Surrounded by</text>
  <text x="150" y="326" font-family="Geist, Inter, sans-serif" font-size="54" font-weight="600" fill="#f6f5f3" letter-spacing="-1.8">what's working.</text>
  <text x="150" y="390" font-family="Geist, Inter, sans-serif" font-size="54" font-weight="600" fill="#7cc7a6" letter-spacing="-1.8">Always in your voice.</text>

  <text x="151" y="436" font-family="Geist, sans-serif" font-size="18.5" fill="#9b99a4" letter-spacing="-0.1">Find proven outliers · decode why they worked · write them in your voice.</text>

  <!-- one quiet CTA, like the Eden reference -->
  <g transform="translate(150,468)">
    <rect width="196" height="44" rx="100" fill="#28775c" fill-opacity="0.16" stroke="#5fb896" stroke-opacity="0.55"/>
    <text x="98" y="28" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="500" fill="#a8e0c4">Request access →</text>
  </g>

  <text x="150" y="580" font-family="'Geist Mono', monospace" font-size="15" fill="#6f6d77" letter-spacing="0.4">buildwithsona.com</text>
</svg>
